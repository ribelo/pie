# Recommended configuration for ~/.config/pie/stt.toml (2026-10-01).
# Not installed. Keep your existing text_entry_rules / newline_rules below it.
# text_entry_rules.method is always paste. method = "type" is accepted only
# for compatibility and warns at startup; the rule pastes.
# One pass: Gemini hears the audio, the prompt and the glossary together.
# Measured against two passes in docs/research/2026-09-30-dictation-models:
# 7 of 8 hard spots right, p50 about 2.2 s when pinned to Google AI Studio.

# Supported values: one-pass (also the default when omitted), two-pass.
pipeline = "one-pass"
provider = "openrouter"

transcription_model = "openrouter/google/gemini-3.8-flash"
translation_model = "openrouter/google/gemini-3.8-flash"
thinking_effort = "low"
# The first request keeps this effort and the strict {text} answer schema.
# Schema framing names the output language; only text is typed. A deliberate
# provider-failure retry may raise effort to medium; history records the actual
# final effort, response_schema and chosen prompt_file.

# Route OpenRouter to Google AI Studio first. Fallbacks stay allowed.
openrouter_provider_order = ["Google AI Studio"]

# Bounds the one Responses call. correction_timeout_seconds does not apply.
# 30 s covers the measured tail (p90 about 5 s) with room for a longer
# utterance. Raise it for a very long recording; a timeout keeps the audio
# for pie retry.
one_pass_timeout_seconds = 30

transcription_language = "Polish"
translation_source_language = "Polish"
translation_target_language = "English"

# One pass is buffered. streaming = true is rejected.
# Audio and private provider responses share a seven-day retention window.
audio_retention_hours = 168

# Right Ctrl (65508) with Shift: tidy transcription (prompts/one-pass.md).
# Mod5 + Right Shift latches transcription.
[[bindings]]
keysym = 65508
shift = true
mode = "transcribe"
correct = true

# Right Ctrl alone: translate Polish to English (prompts/one-pass-translate.md).
# Mod5 + Right Ctrl latches translation.
[[bindings]]
keysym = 65508
shift = false
mode = "translate"

# A raw transcript (correct = false, prompts/one-pass-verbatim.md) needs a key of its own; add
# another [[bindings]] entry with a free keysym to get one.

# Optional destination prompt (dict-c3nt). First matching rule wins over the
# binding prompt; absent focus or no match retains the binding/pipeline default.
# App ids compare case-insensitively, like text_entry_rules. title_regex is a
# Perl regex; when both are set, both must match. Only the key-press window counts.
# Create prompts/neutral.md first: it must contain {{glossary}}. Translation
# rules also need {{source_language}} and {{target_language}}; rules without a
# mode must satisfy every configured binding mode. No neutral prompt is shipped.
# [[prompt_rules]]
# app_id = "slack"
# mode = "transcribe"
# prompt = "neutral.md"
